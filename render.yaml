services:
  - type: web
    name: floodsafe-api
    runtime: python
    plan: free
    rootDir: api
    # Importing app.routing compiles the Numba route search into app/__pycache__,
    # so a cold start loads it instead of compiling (Numba recompiles if the CPU differs).
    buildCommand: pip install -r requirements.txt && python -c "import app.routing"
    # One process on purpose: the rate limits and the rainfall cache live in memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RAINFALL_RELAY_SECRET
        sync: false  # set in the Render dashboard; the same value as the GitHub secret
      # Postgres (Neon) keeps reports, push subscriptions and SOS pings across
      # restarts; without it they live in a SQLite file the free disk loses.
      - key: DATABASE_URL
        sync: false
      # Push alerts: make a pair with `python -m app.push` from api/.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional: SOS texts sent by the server (textbee.dev). Without these the
      # app opens the phone's own SMS app.
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
  - type: web
    name: floodsafe-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://floodsafe-api-4nzc.onrender.com
