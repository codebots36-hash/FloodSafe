services:
  - type: web
    name: floodsafe-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # One process on purpose: the rate limits and the rainfall cache live in memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RAINFALL_RELAY_SECRET
        sync: false  # set in the Render dashboard; the same value as the GitHub secret
