services:
  - type: web
    name: floodsafe-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # One process on purpose: the rate limits and the rainfall cache live in memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
  - type: web
    name: floodsafe-web
    runtime: static
    branch: shourya
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://floodsafe-api-4nzc.onrender.com
